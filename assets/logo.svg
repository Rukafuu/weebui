<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181126" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="pinkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5ebb" />
      <stop offset="50%" stop-color="#c048f8" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#c048f8" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 900;
      font-size: 68px;
      letter-spacing: -1.5px;
    }
    .brand-subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .brand-badge {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="120" cy="120" r="70" fill="url(#pinkPurple)" opacity="0.25" filter="url(#neonGlow)" />
  <circle cx="150" cy="110" r="50" fill="url(#cyanBlue)" opacity="0.2" filter="url(#neonGlow)" />

  <!-- MASCOT ICON GROUP -->
  <g transform="translate(30, 25)" filter="url(#softShadow)">
    <!-- Rounded Shield / Base Squircle -->
    <rect x="20" y="15" width="150" height="150" rx="36" fill="#161526" stroke="url(#pinkPurple)" stroke-width="3" />

    <!-- Cute Anime Cat Ears (3D / Poly style) -->
    <!-- Left Ear -->
    <polygon points="40,25 22,-8 68,16" fill="url(#pinkPurple)" />
    <polygon points="43,23 30,2 62,18" fill="#ff70c5" opacity="0.8" />
    <!-- Right Ear -->
    <polygon points="150,25 168,-8 122,16" fill="url(#pinkPurple)" />
    <polygon points="147,23 160,2 128,18" fill="#ff70c5" opacity="0.8" />

    <!-- Isometric 3D Cube (Mesh Core) inside Mascot -->
    <!-- Top Face -->
    <polygon points="95,46 138,68 95,90 52,68" fill="#ff70c5" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="52,68 95,90 95,142 52,120" fill="url(#pinkPurple)" />
    <!-- Right Face -->
    <polygon points="95,90 138,68 138,120 95,142" fill="url(#cyanBlue)" />

    <!-- Kawaii Eyes on 3D Faces -->
    <!-- Left Wink Eye (^_^) -->
    <path d="M 66 102 Q 74 94 82 102" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Right Sparkle Eye (*_*) -->
    <ellipse cx="116" cy="100" rx="6" ry="8" fill="#ffffff" />
    <circle cx="118" cy="97" r="2.5" fill="#38bdf8" />

    <!-- Cute Blush Marks -->
    <ellipse cx="64" cy="114" rx="7" ry="3.5" fill="#ff4d94" opacity="0.85" />
    <ellipse cx="126" cy="114" rx="7" ry="3.5" fill="#ff4d94" opacity="0.85" />

    <!-- Cute W Mouth -->
    <path d="M 90 108 Q 93 113 96 109 Q 99 113 102 108" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Floating 3D Sparkle / Star -->
    <path d="M 160 30 Q 160 40 170 40 Q 160 40 160 50 Q 160 40 150 40 Q 160 40 160 30 Z" fill="url(#goldStar)" filter="url(#neonGlow)" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(230, 110)">
    <!-- Main Text "Weeb" + "UI" -->
    <text class="brand-title" x="0" y="24" fill="#ffffff">
      Weeb<tspan fill="url(#pinkPurple)">UI</tspan>
    </text>

    <!-- Version / Architecture Badge -->
    <g transform="translate(270, -22)">
      <rect x="0" y="0" width="116" height="24" rx="12" fill="#201b33" stroke="url(#pinkPurple)" stroke-width="1.5" />
      <text class="brand-badge" x="58" y="16" fill="#f472b6" text-anchor="middle">v0.1.0 • GPUI</text>
    </g>

    <!-- Subtitle -->
    <text class="brand-subtitle" x="2" y="62" fill="#94a3b8">
      3D Anime Avatar &amp; VRM Engine for Rust
    </text>

    <!-- Feature Tags -->
    <g transform="translate(2, 78)">
      <text font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
        MToon Cel-Shading <tspan fill="#475569">|</tspan> VRMA Retargeting <tspan fill="#475569">|</tspan> SpringBones <tspan fill="#475569">|</tspan> Lip-Sync
      </text>
    </g>
  </g>
</svg>
