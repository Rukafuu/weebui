[package]
name = "gpui-vrm"
version = "0.1.0"
edition = "2024"
authors = ["Usami Project Contributors"]
description = "Native 3D VRM 0.x/1.0 avatar, glTF, MToon cel-shading, VRMA animation, and lip-sync engine for GPUI"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rukafuu/weebui"
keywords = ["gpui", "vrm", "3d", "avatar", "wgpu"]
categories = ["gui", "graphics", "rendering"]

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
gltf = { version = "1.4", features = ["extras", "names", "KHR_materials_unlit", "KHR_texture_transform"] }
gpui = "0.2.2"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp"] }
parking_lot = "0.12"
pollster = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
wgpu = "25.0"

[[example]]
name = "avatar_viewer"
path = "examples/avatar_viewer.rs"
